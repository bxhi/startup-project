<svg xmlns="http://www.2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Base styling for Chargily -->
    <defs>
        <linearGradient id="chargilyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Outer C -->
    <path d="M 80 20 C 60 0, 20 0, 10 40 C 0 80, 40 100, 80 80" fill="none" stroke="url(#chargilyGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Inner accent -->
    <circle cx="50" cy="50" r="12" fill="#0ea5e9" />
</svg>
